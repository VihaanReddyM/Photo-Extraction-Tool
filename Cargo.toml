[package]
name = "photo_extraction_tool"
version = "1.0.0"
edition = "2021"
description = "A fast, reliable tool to extract photos from iOS devices (iPhone/iPad) on Windows — no iTunes or drivers required (Windows & Linux)"
authors = ["Vihaan Reddy M"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/VihaanReddyM/Photo-Extraction-Tool"
homepage = "https://github.com/VihaanReddyM/Photo-Extraction-Tool"
documentation = "https://github.com/VihaanReddyM/Photo-Extraction-Tool#readme"
rust-version = "1.75"
keywords = ["iphone", "android", "photos", "backup", "mtp"]
categories = ["command-line-utilities", "filesystem", "multimedia"]

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Progress bar
indicatif = "0.17"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Configuration file support
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Signal handling for graceful shutdown
ctrlc = "3.4"

# Duplicate detection
sha2 = "0.10"
walkdir = "2.5"

# Multi-threading
rayon = "1.10"

# User input for interactive prompts
dialoguer = "0.11"

# Random number generation (for test scenarios)
rand = "0.8"

# Platform-specific directories (Pictures, Documents, etc.)
dirs = "5.0"

# Base64 encoding (for thumbnail data URLs)
base64 = "0.22"

# GUI framework - egui with eframe for native windows
egui = "0.29"
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }

# Image loading for thumbnails and icons
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# Async runtime for background tasks
tokio = { version = "1.41", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Crossbeam for advanced channel operations
crossbeam-channel = "0.5"

# Notify for file system watching
notify = "6.1"

# Open file/folder in system browser
open = "5.3"

# Clipboard support
arboard = "3.4"

# Native file dialogs
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }

[target.'cfg(unix)'.dependencies]
eframe = { version = "0.29", default-features = false, features = ["x11", "wayland"] }

# Windows API bindings
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Devices_PortableDevices",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_Storage_FileSystem",
    "Win32_System_Variant",
] }

[dev-dependencies]
# Temporary directories for testing
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
